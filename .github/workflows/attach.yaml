name: "Attach data"

on:
  push:

jobs:
  attach:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--enable-source-maps"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4

      - uses: actions/setup-node@v7
        with: { cache: yarn }

      - run: yarn install --immutable
      - run: yarn run build

      - run: yarn twice attach
      - run: yarn twice push
