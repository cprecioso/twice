name: "Attach data"

on:
  push:

jobs:
  attach:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      attestations: write
      contents: write

    env:
      NODE_OPTIONS: "--enable-source-maps"

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: actions/setup-node@v7
        with: { cache: yarn }

      - run: yarn install --immutable
      - run: yarn run build

      - run: yarn twice attach
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: yarn twice push
        env:
          GITHUB_TOKEN: ${{ github.token }}
